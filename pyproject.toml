[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpr-system"
version = "0.1.0"
description = "Sistema ALPR en producción para placas Mercosur (CPU-Optimized)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ALPR Team"}
]
keywords = ["alpr", "anpr", "license-plate", "yolov8", "paddleocr", "mercosur"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ultralytics>=8.3.0",
    "paddlepaddle>=2.6.0,<4.0.0",
    "paddleocr>=2.9.0,<3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0,<3.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.1",
    "requests>=2.32.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "scipy>=1.14.0",
    "fast-plate-ocr[onnx]>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "locust>=2.32.0",
]

[project.scripts]
alpr-train-yolo = "alpr.training.train_yolo:main"
alpr-evaluate = "alpr.eval.evaluate:main"
alpr-api = "alpr.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpr*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
